<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 892" width="412" height="892">
  <rect width="412" height="892" fill="#131418"/>
  
    <!-- Status Bar (Figma Native Vectors) -->
    <g id="StatusBar">
      <text x="36" y="38" fill="#E2E2E6" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600">09:41</text>
      <!-- Signal Bars -->
      <g transform="translate(322, 26)" fill="#E2E2E6">
        <rect x="0" y="10" width="3" height="4" rx="0.5"/>
        <rect x="5" y="7" width="3" height="7" rx="0.5"/>
        <rect x="10" y="4" width="3" height="10" rx="0.5"/>
        <rect x="15" y="1" width="3" height="13" rx="0.5"/>
      </g>
      <!-- WiFi Icon -->
      <path d="M352 38 a 2 2 0 1 1 0.01 0 M347 34 a 8 8 0 0 1 10 0 M343 30 a 14 14 0 0 1 18 0" stroke="#E2E2E6" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Battery Icon -->
      <g transform="translate(366, 26)">
        <rect x="0" y="1" width="22" height="12" rx="3.5" fill="none" stroke="#E2E2E6" stroke-width="1.8"/>
        <rect x="2" y="3" width="14" height="8" rx="2" fill="#E2E2E6"/>
        <path d="M23 5 C23.8 5 24 5.5 24 7 C24 8.5 23.8 9 23 9" fill="#E2E2E6"/>
      </g>
    </g>
    <!-- Home Gesture Indicator -->
    <g id="HomeIndicator">
      <rect x="166" y="874" width="80" height="4" rx="2" fill="#8E9099" fill-opacity="0.6"/>
    </g>
    
  <g id='TopBar'>
        <g id="BackBtn" cursor="pointer">
          <circle cx="44" cy="74" r="22" fill="transparent"/>
          <path d="M48 64 L38 74 L48 84" stroke="#E2E2E6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </g>
        <text x="78" y="80" fill="#E2E2E6" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="600">Bussola Pixel</text>
        </g>

  <!-- Heading Info -->
  <g id="HeadingHeader">
    <text x="206" y="165" fill="#E2E2E6" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="54" font-weight="300" text-anchor="middle">42° NE</text>
    <text x="206" y="195" fill="#A8C7FA" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Nord-Est • Precisione Elevata</text>
  </g>

  <!-- Compass Rose -->
  <g id="CompassRose" transform="translate(206, 410)">
    <circle cx="0" cy="0" r="160" fill="#181A20" stroke="#2C2E35" stroke-width="2"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="#22252C" stroke-width="1.5"/>

    <!-- Degree Ticks -->
    <g stroke="#4F5360" stroke-width="1.5">
      <line x1="0" y1="-155" x2="0" y2="-142"/>
      <line x1="110" y1="-110" x2="100" y2="-100"/>
      <line x1="155" y1="0" x2="142" y2="0"/>
      <line x1="110" y1="110" x2="100" y2="100"/>
      <line x1="0" y1="155" x2="0" y2="142"/>
      <line x1="-110" y1="110" x2="-100" y2="100"/>
      <line x1="-155" y1="0" x2="-142" y2="0"/>
      <line x1="-110" y1="-110" x2="-100" y2="-100"/>
    </g>

    <!-- Cardinal Directions -->
    <text x="0" y="-120" fill="#FF5252" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="central">N</text>
    <text x="122" y="0" fill="#E2E2E6" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central">E</text>
    <text x="0" y="122" fill="#E2E2E6" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central">S</text>
    <text x="-122" y="0" fill="#E2E2E6" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central">W</text>

    <!-- Magnetic Needle (orientata a 42 gradi) -->
    <g transform="rotate(-42)">
      <polygon points="0,-115 -14,0 14,0" fill="#FF5252"/>
      <polygon points="0,115 -14,0 14,0" fill="#E2E2E6"/>
      <circle cx="0" cy="0" r="10" fill="#131418" stroke="#E2E2E6" stroke-width="2"/>
    </g>
  </g>

  <!-- GPS Coordinates & Altitude -->
  <g id="GPSCard">
    <rect x="20" y="650" width="372" height="160" rx="20" ry="20" fill="#1E2025" stroke="#2C2E35"/>
    <text x="44" y="686" fill="#A8C7FA" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600">Posizione &amp; Quota</text>
    
    <text x="44" y="720" fill="#8E9099" font-size="13">Coordinate:</text>
    <text x="44" y="744" fill="#E2E2E6" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="500">41° 54' 38" N • 12° 29' 47" E</text>

    <text x="44" y="780" fill="#8E9099" font-size="13">Altitudine: <tspan fill="#34D399" font-weight="600">48 m s.l.m.</tspan></text>
  </g>
</svg>