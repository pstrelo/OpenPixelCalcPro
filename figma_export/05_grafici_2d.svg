<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 892" width="412" height="892">
  <rect width="412" height="892" fill="#131418"/>
  
    <!-- Status Bar (Figma Native Vectors) -->
    <g id="StatusBar">
      <text x="36" y="38" fill="#E2E2E6" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600">09:41</text>
      <!-- Signal Bars -->
      <g transform="translate(322, 26)" fill="#E2E2E6">
        <rect x="0" y="10" width="3" height="4" rx="0.5"/>
        <rect x="5" y="7" width="3" height="7" rx="0.5"/>
        <rect x="10" y="4" width="3" height="10" rx="0.5"/>
        <rect x="15" y="1" width="3" height="13" rx="0.5"/>
      </g>
      <!-- WiFi Icon -->
      <path d="M352 38 a 2 2 0 1 1 0.01 0 M347 34 a 8 8 0 0 1 10 0 M343 30 a 14 14 0 0 1 18 0" stroke="#E2E2E6" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Battery Icon -->
      <g transform="translate(366, 26)">
        <rect x="0" y="1" width="22" height="12" rx="3.5" fill="none" stroke="#E2E2E6" stroke-width="1.8"/>
        <rect x="2" y="3" width="14" height="8" rx="2" fill="#E2E2E6"/>
        <path d="M23 5 C23.8 5 24 5.5 24 7 C24 8.5 23.8 9 23 9" fill="#E2E2E6"/>
      </g>
    </g>
    <!-- Home Gesture Indicator -->
    <g id="HomeIndicator">
      <rect x="166" y="874" width="80" height="4" rx="2" fill="#8E9099" fill-opacity="0.6"/>
    </g>
    
  <g id='TopBar'>
        <g id="BackBtn" cursor="pointer">
          <circle cx="44" cy="74" r="22" fill="transparent"/>
          <path d="M48 64 L38 74 L48 84" stroke="#E2E2E6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </g>
        <text x="78" y="80" fill="#E2E2E6" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="600">Grafico Funzione 2D</text>
        </g>

  <!-- Function Input Bar -->
  <g id="FunctionBar">
    <rect x="20" y="115" width="372" height="56" rx="16" ry="16" fill="#1E2025" stroke="#2C2E35" stroke-width="1.5"/>
    <text x="40" y="150" fill="#A8C7FA" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600">f(x) =</text>
    <text x="96" y="150" fill="#E2E2E6" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="500">sin(x) * 1.5</text>
    
    <!-- Plot button -->
    <rect x="326" y="125" width="56" height="36" rx="12" ry="12" fill="#A8C7FA"/>
    <text x="354" y="148" fill="#041E49" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Disegna</text>
  </g>

  <!-- Cartesio Canvas Box -->
  <g id="Canvas2D">
    <rect x="20" y="190" width="372" height="480" rx="20" ry="20" fill="#181A20" stroke="#2C2E35" stroke-width="1"/>
    
    <!-- Grid Lines -->
    <path d="M40 250 H372 M40 310 H372 M40 370 H372 M40 490 H372 M40 550 H372 M40 610 H372" stroke="#242832" stroke-width="1"/>
    <path d="M82 210 V650 M144 210 V650 M268 210 V650 M330 210 V650" stroke="#242832" stroke-width="1"/>

    <!-- Main Axis X & Y -->
    <line x1="40" y1="430" x2="372" y2="430" stroke="#4F5360" stroke-width="2"/>
    <line x1="206" y1="210" x2="206" y2="650" stroke="#4F5360" stroke-width="2"/>

    <text x="365" y="422" fill="#8E9099" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="12">X</text>
    <text x="214" y="222" fill="#8E9099" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="12">Y</text>
    <text x="214" y="444" fill="#8E9099" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="11">0</text>

    <!-- Sine Wave Curve: f(x) = sin(x) -->
    <path d="M 50 430 Q 89 320, 128 430 T 206 430 T 284 430 T 362 430" stroke="#34D399" stroke-width="3" fill="none"/>

    <!-- Peak and Intercept Points -->
    <circle cx="128" cy="430" r="4" fill="#FFD152"/>
    <circle cx="167" cy="508" r="4" fill="#FFB4AB"/>
    <circle cx="206" cy="430" r="4" fill="#FFD152"/>
    <circle cx="245" cy="352" r="4" fill="#A8C7FA"/>

    <!-- On Canvas Zoom Buttons -->
    <g transform="translate(336, 560)">
      <circle cx="20" cy="20" r="18" fill="#26282E" stroke="#373942"/>
      <text x="20" y="26" fill="#E2E2E6" font-size="20" font-weight="400" text-anchor="middle">+</text>

      <circle cx="20" cy="64" r="18" fill="#26282E" stroke="#373942"/>
      <text x="20" y="70" fill="#E2E2E6" font-size="20" font-weight="400" text-anchor="middle">−</text>
    </g>
  </g>

  <!-- Quick Analysis Stats -->
  <g id="AnalysisCard">
    <rect x="20" y="690" width="372" height="135" rx="18" ry="18" fill="#1E2025" stroke="#2C2E35"/>
    <text x="40" y="722" fill="#A8C7FA" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600">Analisi Funzione</text>
    
    <text x="40" y="750" fill="#8E9099" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13">Periodo (T): <tspan fill="#E2E2E6" font-weight="500">2π ≈ 6.283</tspan></text>
    <text x="40" y="775" fill="#8E9099" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13">Ampiezza Max: <tspan fill="#34D399" font-weight="500">y = 1.5</tspan> | Min: <tspan fill="#FFB4AB" font-weight="500">y = -1.5</tspan></text>
    <text x="40" y="800" fill="#8E9099" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13">Intersezioni Asse X: <tspan fill="#E2E2E6">x = k·π</tspan></text>
  </g>
</svg>