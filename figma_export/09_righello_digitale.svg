  </g>

  <!-- Interactive Measurement Marker Slider -->
  <g id="MeasurementMarker">
    <line x1="0" y1="380" x2="412" y2="380" stroke="#FFD152" stroke-width="2.5" stroke-dasharray="6 4"/>
    <rect x="180" y="362" width="130" height="36" rx="18" ry="18" fill="#FFD152"/>
    <text x="245" y="386" fill="#3D2A00" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">5.00 cm</text>
  </g>

  <!-- Info Box -->
  <g id="InfoBox">
    <rect x="90" y="720" width="300" height="110" rx="18" ry="18" fill="#1E2025" stroke="#2C2E35"/>
    <text x="110" y="752" fill="#A8C7FA" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600">Calibrazione Schermo</text>
    <text x="110" y="776" fill="#8E9099" font-size="12">Pixel Density: 441 PPI (1:1 scala reale)</text>
    <text x="110" y="800" fill="#E2E2E6" font-size="13">Misura: 5.00 cm / 1.97 in</text>
