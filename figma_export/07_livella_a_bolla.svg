<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 892" width="412" height="892">
  <rect width="412" height="892" fill="#131418"/>
  
    <!-- Status Bar (Figma Native Vectors) -->
    <g id="StatusBar">
      <text x="36" y="38" fill="#E2E2E6" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600">09:41</text>
      <!-- Signal Bars -->
      <g transform="translate(322, 26)" fill="#E2E2E6">
        <rect x="0" y="10" width="3" height="4" rx="0.5"/>
        <rect x="5" y="7" width="3" height="7" rx="0.5"/>
        <rect x="10" y="4" width="3" height="10" rx="0.5"/>
        <rect x="15" y="1" width="3" height="13" rx="0.5"/>
      </g>
      <!-- WiFi Icon -->
      <path d="M352 38 a 2 2 0 1 1 0.01 0 M347 34 a 8 8 0 0 1 10 0 M343 30 a 14 14 0 0 1 18 0" stroke="#E2E2E6" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Battery Icon -->
      <g transform="translate(366, 26)">
        <rect x="0" y="1" width="22" height="12" rx="3.5" fill="none" stroke="#E2E2E6" stroke-width="1.8"/>
        <rect x="2" y="3" width="14" height="8" rx="2" fill="#E2E2E6"/>
        <path d="M23 5 C23.8 5 24 5.5 24 7 C24 8.5 23.8 9 23 9" fill="#E2E2E6"/>
      </g>
    </g>
    <!-- Home Gesture Indicator -->
    <g id="HomeIndicator">
      <rect x="166" y="874" width="80" height="4" rx="2" fill="#8E9099" fill-opacity="0.6"/>
    </g>
    
  <g id='TopBar'>
        <g id="BackBtn" cursor="pointer">
          <circle cx="44" cy="74" r="22" fill="transparent"/>
          <path d="M48 64 L38 74 L48 84" stroke="#E2E2E6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </g>
        <text x="78" y="80" fill="#E2E2E6" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="600">Livella a Bolla</text>
        </g>

  <!-- Angle Display Header -->
  <g id="DegreesHeader">
    <text x="206" y="170" fill="#E2E2E6" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="64" font-weight="300" text-anchor="middle">0.0°</text>
    <text x="206" y="200" fill="#34D399" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">PERFETTAMENTE A LIVELLO</text>
  </g>

  <!-- Big Concentric Bullseye Bubble Indicator -->
  <g id="BullseyeLevel" transform="translate(206, 420)">
    <circle cx="0" cy="0" r="160" fill="#1A1C22" stroke="#2C2E35" stroke-width="2"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#26282E" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#373942" stroke-width="2"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#34D399" stroke-width="2" stroke-opacity="0.6"/>

    <line x1="-160" y1="0" x2="160" y2="0" stroke="#373942" stroke-width="1.5"/>
    <line x1="0" y1="-160" x2="0" y2="160" stroke="#373942" stroke-width="1.5"/>

    <!-- Green Liquid Bubble -->
    <circle cx="2" cy="-1" r="32" fill="#34D399" opacity="0.85"/>
    <circle cx="-6" cy="-8" r="8" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Pitch & Roll Cards -->
  <g id="AxesStats">
    <rect x="20" y="650" width="176" height="84" rx="18" ry="18" fill="#1E2025" stroke="#2C2E35"/>
    <text x="40" y="682" fill="#8E9099" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13">Inclinazione X (Pitch)</text>
    <text x="40" y="715" fill="#E2E2E6" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="500">+0.2°</text>

    <rect x="216" y="650" width="176" height="84" rx="18" ry="18" fill="#1E2025" stroke="#2C2E35"/>
    <text x="236" y="682" fill="#8E9099" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13">Inclinazione Y (Roll)</text>
    <text x="236" y="715" fill="#E2E2E6" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="500">-0.1°</text>
  </g>

  <!-- Calibration Action -->
  <g id="CalibrateBtn" cursor="pointer">
    <rect x="20" y="760" width="372" height="52" rx="26" ry="26" fill="#26282E" stroke="#373942"/>
    <text x="206" y="792" fill="#A8C7FA" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Calibra Sensore Orizzontale</text>
  </g>
</svg>